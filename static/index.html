<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHATBI 财务智能检索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
  header { background:#1f6feb; color:#fff; padding:14px 20px; }
  header h1 { font-size:18px; }
  header p { font-size:12px; opacity:.85; margin-top:2px; }
  #chat { flex:1; overflow-y:auto; padding:20px; max-width:900px; margin:0 auto; width:100%; }
  .msg { margin-bottom:14px; display:flex; flex-direction:column; }
  .msg.user { align-items:flex-end; }
  .msg.bot { align-items:flex-start; }
  .bubble { max-width:85%; padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:#1f6feb; color:#fff; border-top-right-radius:2px; }
  .msg.bot .bubble { background:#fff; border:1px solid #e0e0e0; border-top-left-radius:2px; }
  .meta { font-size:11px; color:#999; margin-top:4px; }
  .msg.bot .meta { align-self:flex-start; }
  .msg.user .meta { align-self:flex-end; }
  .tag { display:inline-block; background:#eef3ff; color:#1f6feb; border-radius:4px; padding:1px 6px; margin-right:4px; }
  .sql-bubble { background:#1e1e1e; color:#d4d4d4; font-family:Consolas,monospace; font-size:12px; }
  #inputBar { border-top:1px solid #e0e0e0; background:#fff; padding:12px 20px; display:flex; gap:10px; max-width:900px; margin:0 auto; width:100%; }
  #input { flex:1; border:1px solid #d0d0d0; border-radius:8px; padding:10px 12px; font-size:14px; outline:none; }
  #input:focus { border-color:#1f6feb; }
  #send { background:#1f6feb; color:#fff; border:none; border-radius:8px; padding:0 22px; font-size:14px; cursor:pointer; }
  #send:disabled { background:#b3c7ef; cursor:not-allowed; }
  .typing { color:#999; font-size:13px; padding:6px 2px; }
</style>
</head>
<body>
<header>
  <h1>CHATBI · 财务智能检索演示</h1>
  <p>LangGraph 工作流：意图路由 / SQL 三层护栏 / 反思重试 / FAISS 向量检索 / 多轮记忆</p>
</header>
<div id="chat"></div>
<div id="inputBar">
  <input id="input" placeholder="试试：天晟2026年二季度服务类收款合同税额合计多少？">
  <button id="send">发送</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const sessionId = 'web-' + Date.now();   // 每次刷新开新会话，多轮记忆从本轮开始

  function addMsg(role, text, meta, sql) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (sql ? ' sql-bubble' : '');
    bubble.textContent = text;
    div.appendChild(bubble);
    if (meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.innerHTML = meta;
      div.appendChild(m);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    addMsg('user', q);
    send.disabled = true;
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = '思考中…';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, session_id: sessionId }),
      });
      const data = await resp.json();
      typing.remove();
      if (!resp.ok) { addMsg('bot', '出错：' + (data.detail || resp.status)); return; }
      const meta = `<span class="tag">${data.intent}</span><span class="tag">${data.source}</span>`;
      addMsg('bot', data.answer, meta);
      if (data.sql) addMsg('bot', data.sql, '<span class="tag">执行 SQL</span>', true);
    } catch (e) {
      typing.remove();
      addMsg('bot', '网络错误：请确认后端 server.py 已启动。');
    } finally {
      send.disabled = false;
    }
  }

  send.onclick = ask;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
  addMsg('bot',
    '你好，我是财务智能助手。可以：\n1. 查数据（合同/收付款/财务三表）——如「天晟2026年二季度服务类收款合同税额合计多少？」\n2. 问制度口径——如「对甲签证为什么要三方确认？」\n3. 多轮追问——先问收款合同，再问「那施工类的税额呢？」',
    '<span class="tag">系统</span>');
</script>
</body>
</html>
